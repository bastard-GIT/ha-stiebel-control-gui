name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gui/requirements.txt

      - name: Qt-Systembibliotheken installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Abhaengigkeiten installieren
        run: pip install -r gui/requirements.txt pytest

      - name: Tests ausfuehren
        run: QT_QPA_PLATFORM=offscreen python -I -m pytest -q
