# Example MQTT credentials for the GUI.
# Copy to secrets.yaml in the same folder and fill in your values:
#   cp secrets.example.yaml secrets.yaml
# secrets.yaml is git-ignored. Never commit it.
# Alternative location: set the environment variable STIEBEL_SECRETS to the file path.
# The format matches the secrets.yaml of an ESPHome project, so that file can be used directly.
# Keep comments on their own lines: the GUI parser does not strip comments after a value.

# Host name or address of the MQTT broker
mqtt_server: "broker.local"
# 1883 = plain MQTT
mqtt_port: 1883
mqtt_username: "stiebel-gui"
mqtt_password: "change-me"
